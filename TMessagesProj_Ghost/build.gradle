apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'
apply plugin: 'com.chaquo.python'

def astraPrivateProperties = new Properties()
def astraPrivatePropertiesFile = rootProject.file('astra.local.properties')
if (astraPrivatePropertiesFile.exists()) {
    astraPrivatePropertiesFile.withInputStream { astraPrivateProperties.load(it) }
}
def astraPrivateValue = { String property, String environment ->
    providers.gradleProperty(property)
            .orElse(providers.environmentVariable(environment))
            .getOrElse(astraPrivateProperties.getProperty(property, '')).trim()
}
def astraApiId = astraPrivateValue('astraApiId', 'ASTRA_API_ID')
def astraApiHash = astraPrivateValue('astraApiHash', 'ASTRA_API_HASH')
def astraMapsApiKey = astraPrivateValue('astraMapsApiKey', 'ASTRA_MAPS_API_KEY')
if (!(astraApiId ==~ /[1-9][0-9]*/)) throw new GradleException('Set astraApiId in astra.local.properties or ASTRA_API_ID.')
if (!(astraApiHash ==~ /[0-9A-Fa-f]{32}/)) throw new GradleException('Set astraApiHash in astra.local.properties or ASTRA_API_HASH.')

android {
    namespace 'org.ghostgram.messenger'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.ghostgram.messenger'
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(APP_VERSION_CODE)
        versionName APP_VERSION_NAME + '-astra.121'
        buildConfigField 'int', 'ASTRA_API_ID', astraApiId
        buildConfigField 'String', 'ASTRA_API_HASH', '"' + astraApiHash + '"'
        manifestPlaceholders.ghostMapsApiKey = astraMapsApiKey
        multiDexEnabled true
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug {
            debuggable project.hasProperty('ghostLicenseDiagnostics') || project.hasProperty('ghostDebugTools')
            minifyEnabled false
            // Android's local debug key, not Telegram's bundled release key.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    androidResources {
        noCompress += ['pack', 'bin', 'zip']
        localeFilters += ['zz']
    }
    buildFeatures { buildConfig true }
    packaging {
        jniLibs.useLegacyPackaging = true
        jniLibs.pickFirsts += ['**/libc++_shared.so']
    }
    lint { disable 'MissingTranslation', 'ExtraTranslation' }
    sourceSets {
        main.assets.exclude 'whisper/**', 'vosk/**'
        debug {
            if (!project.hasProperty('ghostLicenseDiagnostics')) {
                manifest.srcFile 'src/private/AndroidManifest.xml'
                java.setSrcDirs([])
            }
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        extractPackages "debugpy"
        pip {
            install "yt-dlp==2026.10.26"
            install "yt-dlp-ejs==0.8.0"
            install "requests==2.32.5"
            install "beautifulsoup4"
            install "packaging==25.0"
            install "../Tools/python-vendor/debugpy-1.8.14-py3-none-any.whl"
            install "PyYAML"
            install "Pillow"
            install "lxml"
            install "typing_extensions"
            install "phonenumbers==9.0.41"
        }
    }
}

dependencies {
    debugImplementation 'androidx.exifinterface:exifinterface:1.3.6'
    debugImplementation 'com.google.zxing:core:3.5.4'
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment:1.5.7'
    implementation 'com.linkedin.dexmaker:dexmaker:2.28.6'
    implementation 'org.mvel:mvel2:2.5.2.Final'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}
